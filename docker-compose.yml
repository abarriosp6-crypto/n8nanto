services:
  n8n:
    image: n8nio/n8n
    restart: always
    user: root
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Guatemala
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./data:/data